<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6678"/></marker></defs><rect width="960" height="800" fill="#F4F6F9"/>
<rect x="140.0" y="20" width="520" height="56" rx="6" fill="#fff" stroke="#9AA6BA" stroke-width="1.4"/>
<text x="400" y="44" font-size="13.5" fill="#17202E" font-weight="700" text-anchor="middle" >Yêu cầu: chủ thể, hành động, đối tượng</text>
<text x="400" y="64" font-size="12.5" fill="#5B6678" font-weight="400" text-anchor="middle" >Ví dụ: An, đọc, baocao_Q3.pdf</text>
