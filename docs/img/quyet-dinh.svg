<text x="792" y="544" font-size="15" fill="#086B49" font-weight="700" text-anchor="middle" >Được phép</text>
<text x="792" y="564" font-size="12" fill="#086B49" font-weight="400" text-anchor="middle" >Kèm danh sách luật đã khớp</text>
<line x1="400" y1="594" x2="400" y2="650" stroke="#5B6678" stroke-width="1.8" marker-end="url(#a)"/>
<text x="414" y="626" font-size="12" fill="#5B6678" font-weight="700" text-anchor="start" >không</text>
<rect x="200" y="652" width="400" height="60" rx="6" fill="#FBEAE9" stroke="#C8302A" stroke-width="1.4"/>
<text x="400" y="678" font-size="15" fill="#922019" font-weight="700" text-anchor="middle" >Từ chối mặc định</text>
<text x="400" y="698" font-size="12" fill="#922019" font-weight="400" text-anchor="middle" >Không luật nào khớp thì không được phép</text>
<text x="130" y="770" font-size="12" fill="#5B6678" font-weight="400" text-anchor="start" >Cấm thắng cho phép và mặc định từ chối là lựa chọn của nhóm, bài báo không quy định.</text>
</svg>